name: Retos EF smoke test

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for GitHub Pages deployment
        run: sleep 35

      - name: Check live page contains the latest app
        shell: bash
        run: |
          set -euo pipefail
          URL="https://jorgelanchas22-hue.github.io/retos-ef/"
          for i in {1..8}; do
            if curl -fsSL --max-time 20 "$URL" -o /tmp/retos.html; then
              if grep -q 'id:351' /tmp/retos.html && grep -q 'jorge.lanchas@triana.salesianos.edu' /tmp/retos.html; then
                echo "PASS: GitHub Pages serves the latest Retos EF build."
                exit 0
              fi
            fi
            sleep 10
          done
          echo "FAIL: Latest build not detected on GitHub Pages."
          exit 1

      - name: Diagnose Firebase student persistence
        shell: bash
        env:
          API_KEY: "AIzaSyClXyE442TxG4CHXYS1bvXF6Q6oILFAtEQ"
          DB_URL: "https://retos-ef-default-rtdb.europe-west1.firebasedatabase.app"
        run: |
          set -u
          AUTH_CODE=$(curl -sS -o /tmp/auth.json -w "%{http_code}" -X POST \
            "https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=$API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"returnSecureToken":true}')
          echo "Anonymous auth HTTP: $AUTH_CODE"
          python3 -c 'import json; d=json.load(open("/tmp/auth.json")); print("Anonymous auth result:", d.get("error",{}).get("message","OK"))'

          TOKEN=$(python3 -c 'import json; d=json.load(open("/tmp/auth.json")); print(d.get("idToken",""))')
          ID="smoke_test_4ESOA"
          PAYLOAD='{"info":{"id":"smoke_test_4ESOA","nombre":"Smoke Test","curso":"4ESO","clase":"A"},"retos":{},"propios":{}}'
          WRITE_CODE=000

          if [ -n "$TOKEN" ]; then
            PATH_URL="$DB_URL/retosEF/alumnos/$ID.json?auth=$TOKEN"
            WRITE_CODE=$(curl -sS -o /tmp/write.json -w "%{http_code}" -X PUT "$PATH_URL" -H "Content-Type: application/json" -d "$PAYLOAD")
            echo "Authenticated DB write HTTP: $WRITE_CODE"
            if [ "$WRITE_CODE" = "200" ]; then
              READ_CODE=$(curl -sS -o /tmp/read.json -w "%{http_code}" "$PATH_URL")
              echo "Authenticated DB read HTTP: $READ_CODE"
              curl -sS -X DELETE "$PATH_URL" >/dev/null || true
            fi
          else
            PATH_URL="$DB_URL/retosEF/alumnos/$ID.json"
            WRITE_CODE=$(curl -sS -o /tmp/write.json -w "%{http_code}" -X PUT "$PATH_URL" -H "Content-Type: application/json" -d "$PAYLOAD")
            echo "Unauthenticated DB write HTTP: $WRITE_CODE"
            python3 -c 'import json; d=json.load(open("/tmp/write.json")); print("Unauthenticated DB result:", d.get("error","OK"))' 2>/dev/null || true
            if [ "$WRITE_CODE" = "200" ]; then
              curl -sS -X DELETE "$PATH_URL" >/dev/null || true
            fi
          fi

          if [ "$AUTH_CODE" != "200" ]; then
            echo "FAIL: Anonymous Firebase authentication is not available."
            exit 1
          fi
          if [ "$WRITE_CODE" != "200" ]; then
            echo "FAIL: Student cloud persistence cannot write to Realtime Database."
            exit 1
          fi
          echo "PASS: Firebase anonymous authentication and student persistence work."

      - name: Check Google sign-in configuration
        if: always()
        shell: bash
        env:
          API_KEY: "AIzaSyClXyE442TxG4CHXYS1bvXF6Q6oILFAtEQ"
        run: |
          set -euo pipefail
          curl -fsS "https://www.googleapis.com/identitytoolkit/v3/relyingparty/getProjectConfig?key=$API_KEY" -o /tmp/project.json
          python3 -c 'import json; cfg=json.load(open("/tmp/project.json")); domains=cfg.get("authorizedDomains",[]); print("Authorized domains:", domains); assert "jorgelanchas22-hue.github.io" in domains, "GitHub Pages domain is not authorized"'

          GOOGLE_CODE=$(curl -sS -o /tmp/google-idp.json -w "%{http_code}" -X POST \
            "https://identitytoolkit.googleapis.com/v1/accounts:signInWithIdp?key=$API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"requestUri":"https://jorgelanchas22-hue.github.io/retos-ef/","postBody":"id_token=invalid-test-token&providerId=google.com","returnIdpCredential":true,"returnSecureToken":true}')
          GOOGLE_MSG=$(python3 -c 'import json; d=json.load(open("/tmp/google-idp.json")); print(d.get("error",{}).get("message","OK"))')
          echo "Google provider probe HTTP: $GOOGLE_CODE"
          echo "Google provider probe result: $GOOGLE_MSG"
          if [ "$GOOGLE_MSG" = "OPERATION_NOT_ALLOWED" ] || [ "$GOOGLE_MSG" = "ADMIN_ONLY_OPERATION" ]; then
            echo "FAIL: Google provider is disabled."
            exit 1
          fi
          echo "PASS: GitHub Pages domain is authorized and Google provider is available."
