name: Retos EF smoke test

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for GitHub Pages deployment
        run: sleep 35

      - name: Check live page contains the latest app
        shell: bash
        run: |
          set -euo pipefail
          URL="https://jorgelanchas22-hue.github.io/retos-ef/"
          for i in {1..8}; do
            if curl -fsSL --max-time 20 "$URL" -o /tmp/retos.html; then
              if grep -q 'id:351' /tmp/retos.html && grep -q 'jorge.lanchas@triana.salesianos.edu' /tmp/retos.html; then
                echo "GitHub Pages is serving the latest Retos EF build."
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Latest build not detected on GitHub Pages."
          exit 1

      - name: Check Firebase anonymous auth and student save/read/delete
        shell: bash
        env:
          API_KEY: "AIzaSyClXyE442TxG4CHXYS1bvXF6Q6oILFAtEQ"
          DB_URL: "https://retos-ef-default-rtdb.europe-west1.firebasedatabase.app"
        run: |
          set -euo pipefail
          AUTH_JSON=$(curl -fsS -X POST             "https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=$API_KEY"             -H "Content-Type: application/json"             -d '{"returnSecureToken":true}')
          TOKEN=$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("idToken",""))' <<<"$AUTH_JSON")
          test -n "$TOKEN"
          ID="smoke_test_4ESOA"
          PATH_URL="$DB_URL/retosEF/alumnos/$ID.json?auth=$TOKEN"
          PAYLOAD='{"info":{"id":"smoke_test_4ESOA","nombre":"Smoke Test","curso":"4ESO","clase":"A"},"retos":{},"propios":{}}'
          trap 'curl -sS -X DELETE "$PATH_URL" >/dev/null || true' EXIT
          curl -fsS -X PUT "$PATH_URL" -H "Content-Type: application/json" -d "$PAYLOAD" >/dev/null
          READBACK=$(curl -fsS "$PATH_URL")
          python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["info"]["nombre"]=="Smoke Test"' <<<"$READBACK"
          curl -fsS -X DELETE "$PATH_URL" >/dev/null
          trap - EXIT
          echo "Firebase anonymous authentication and student cloud persistence work."

      - name: Check Google sign-in configuration
        shell: bash
        env:
          API_KEY: "AIzaSyClXyE442TxG4CHXYS1bvXF6Q6oILFAtEQ"
        run: |
          set -euo pipefail
          CFG=$(curl -fsS "https://www.googleapis.com/identitytoolkit/v3/relyingparty/getProjectConfig?key=$API_KEY")
          python3 - <<'PY' <<<"$CFG"
          import json, sys
          cfg=json.load(sys.stdin)
          domains=cfg.get("authorizedDomains", [])
          if "jorgelanchas22-hue.github.io" not in domains:
              raise SystemExit("GitHub Pages domain is not authorized in Firebase Auth")
          providers=cfg.get("idpConfig", [])
          google=[p for p in providers if p.get("provider")=="google.com"]
          if google and google[0].get("enabled") is False:
              raise SystemExit("Google provider is disabled")
          print("GitHub Pages domain is authorized for Firebase Auth.")
          print("Google provider configuration is present/available.")
          PY
